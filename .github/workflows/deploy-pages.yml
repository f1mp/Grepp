name: Publicera Grepp på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera beroenden
        run: npm install
      - name: Bygg den statiska sidan
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Förbered GitHub Pages
        uses: actions/configure-pages@v5
      - name: Ladda upp sidan
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4

